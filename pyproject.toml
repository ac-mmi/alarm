[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-clock"
version = "0.1.0"
description = "Terminal alarm clock application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
alarm-clock = "alarm_clock.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
